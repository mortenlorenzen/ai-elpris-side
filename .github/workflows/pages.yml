# Projekt: Elpris-siden
# Dokument: Udgivelse på GitHub Pages
# Forfatter: Claude, til godkendelse af Morten L.
# Opdateret: 2026-10-27
#
# Energi Data Service svarer kun browsere fra sine egne domæner, så siden kan ikke selv hente priserne.
# Workflowet henter dem hver time med tools/hent-priser.js og udgiver siden med data/priser.js på GitHub Pages.
# Pages skal være slået til med kilden GitHub Actions under Settings → Pages.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  udgiv:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - name: Saml siden og hent priserne
        run: |
          mkdir -p _site
          cp -r index.html src _site/
          node tools/hent-priser.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
