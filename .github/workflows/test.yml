# Projekt: Elpris-siden
# Dokument: CI
# Forfatter: Claude, til godkendelse af Morten L.
# Opdateret: 2026-10-27
#
# Testene skrives med Nodes indbyggede testkører og kræver ingen afhængigheder (KICKOFF.md i ai-kontor-software, afsnit 2).
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
